
name: GoldGuard Backtest Tests

on:
  push:
    branches:
      - main
      - backtest-v1.1

  workflow_dispatch:

jobs:
  backtest-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check data-adapter.js
          node --check signal-engine.js
          node --check historical-integration.js
          node --check backtest-engine.js
          node --check execution-cost.js
          node --check test-engine.js
          node --check test-historical-integration.js
          node --check test-backtest-engine.js
          node --check test-backtest-node.js
          node --check test-backtest-engine-v1.2.js
          node --check test-backtest-advanced.js
          node --check test-end-to-end.js
          node --check test-full-backtest-integration.js
          node --check test-execution-cost.js

      - name: Confirm backtest files exist
        run: |
          test -f data-adapter.js
          test -f signal-engine.js
          test -f historical-integration.js
          test -f test-historical-integration.js
          test -f backtest-engine.js
          test -f test-backtest-node.js
          test -f test-backtest-engine-v1.2.js
          test -f test-backtest-advanced.js
          test -f test-end-to-end.js
          test -f test-full-backtest-integration.js
          test -f execution-cost.js
          test -f test-execution-cost.js
          echo "All required files found."

      - name: Run Historical Integration Tests
        run: |
          set -o pipefail
          node -e '
            global.window = global;
            global.document = {
              body: {
                insertAdjacentHTML: function () {}
              }
            };
            require("./data-adapter.js");
            require("./signal-engine.js");
            require("./historical-integration.js");
            require("./test-historical-integration.js");
          ' | tee historical-integration-test.log

          grep -q "FAILURES: 0" historical-integration-test.log

      - name: Run Node.js backtest tests
        run: |
          node test-backtest-node.js
          node test-backtest-engine-v1.2.js
          node test-backtest-advanced.js
          node test-end-to-end.js
          node test-full-backtest-integration.js
          node test-execution-cost.js
