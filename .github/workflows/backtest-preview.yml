
name: GoldGuard Backtest Tests

on:
  push:
    branches:
      - main
      - backtest-v1.1
    paths-ignore:
      - test-results.json

  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check required files
        run: |
          set -e

          node --check generate-test-report.js
          node --check historical-data-validator-v2.0.js
          node --check test-historical-data-validator-v2.0.js
          node --check test-backtest-advanced.js

          test -f data-adapter.js
          test -f historical-integration.js
          test -f backtest-engine.js
          test -f execution-cost.js
          test -f historical-data-validator-v2.0.js
          test -f test-historical-data-validator-v2.0.js
          test -f test-backtest-advanced.js

      - name: Run all GoldGuard test suites
        id: tests
        run: |
          set +e

          FAILED=0

          run_test() {
            NAME="$1"
            LOG="$2"
            shift 2

            echo ""
            echo "=================================="
            echo "Running: $NAME"
            echo "=================================="

            "$@" 2>&1 | tee "$LOG"
            RESULT=${PIPESTATUS[0]}

            if [ "$RESULT" -ne 0 ]; then
              FAILED=1
              echo "FAILED: $NAME"
            else
              echo "PASSED: $NAME"
            fi
          }

          run_test "Historical Integration" "historical-integration-test.log" node test-historical-integration.js
          run_test "Backtest Regression V1.3" "backtest-regression-test.log" node test-backtest-node.js
          run_test "Backtest Engine V1.2" "backtest-v1.2-test.log" node test-backtest-engine.js
          run_test "Advanced Backtest V1.2" "backtest-advanced-test.log" node test-backtest-advanced.js
          run_test "End-to-End" "end-to-end-test.log" node test-end-to-end.js
          run_test "Full Backtest Integration" "full-backtest-integration-test.log" node test-full-backtest-integration.js
          run_test "Execution Cost V1.3" "execution-cost-test.log" node test-execution-cost.js
          run_test "Historical Data Validator V2.0" "historical-validator-v2.0-test.log" node test-historical-data-validator-v2.0.js

          echo "FAILED=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Generate GoldGuard test report
        run: node generate-test-report.js

      - name: Publish test report
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ ! -f test-results.json ]; then
            echo "Test report was not generated."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test-results.json

          if git diff --cached --quiet; then
            echo "No test report changes to publish."
          else
            git commit -m "Update GoldGuard automated test report"
            git push
          fi

      - name: Final test status
        if: always()
        run: |
          if [ "${{ steps.tests.outputs.FAILED }}" = "1" ]; then
            echo "One or more GoldGuard test suites failed."
            exit 1
          fi

          echo "All GoldGuard test suites passed."
